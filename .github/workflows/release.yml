name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            rustflags: "-C target-feature=+crt-static"
            archive_ext: tar.gz
            bin_name: zellij-mcp-server
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            rustflags: "-C target-feature=+crt-static"
            archive_ext: tar.gz
            bin_name: zellij-mcp-server
          - target: x86_64-apple-darwin
            os: macos-latest
            rustflags: ""
            archive_ext: tar.gz
            bin_name: zellij-mcp-server
          - target: aarch64-apple-darwin
            os: macos-latest
            rustflags: ""
            archive_ext: tar.gz
            bin_name: zellij-mcp-server
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            rustflags: "-C target-feature=+crt-static"
            archive_ext: zip
            bin_name: zellij-mcp-server.exe
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            rustflags: "-C target-feature=+crt-static"
            archive_ext: zip
            bin_name: zellij-mcp-server.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install musl build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          env-vars: RUSTFLAGS

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify static linking (Linux musl)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            echo "error: binary is dynamically linked" >&2
            exit 1
          fi

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="zellij-mcp-server-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "dist/$asset" "${{ matrix.bin_name }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$asset" > "$asset.sha256")
          else
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          fi

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "zellij-mcp-server-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -DestinationPath "dist/$asset" -Force
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/dist/$asset.sha256", "$hash  $asset`n")

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate combined SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
